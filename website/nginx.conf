server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self' https://huggingface.co https://*.hf.co; script-src 'none'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    gzip on;
    gzip_types text/css application/xml image/svg+xml;
    gzip_min_length 1024;
    etag on;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location ~ ^/(datasets(?:\.html)?|features|personas)/?$ {
        return 301 '/#demos';
    }
    location ~ ^/(models(?:/.*)?|research(?:\.html)?|about(?:\.html)?|privacy|pricing|download|faq)/?$ {
        return 301 '/#resources';
    }
    location ~ /\. { return 404; }
    location ~* \.(woff2|svg|png|jpg|mp4)$ {
        expires 1d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
