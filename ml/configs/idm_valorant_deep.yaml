# IDM Phase 0, valorant at corpus scale (the shallow run's ~16x).
#
# Valorant is the one game in gaming-500-hours that reaches the knee on its
# own: 117 sessions, ~132 h raw, ~86 h after the action-density filter. The
# shallow run used 5.5 h of it — 4%.
#
# max_steps stays at 12000 for the same reason as the minecraft deep config:
# fixed optimization budget, data volume as the only variable. At this size
# that is ~0.14 epochs, so a win here is a win on unique frames rather than
# on repetition.
#
# Frames are H.264 (CRF 18); see the minecraft deep config for the codec
# confound and how it is measured.
run_name: idm-valorant-deep
seed: 0

data:
  roots: [data/idm_valorant_deep]
  holdout_games: []       # single game — the split is by session
  val_fraction: 0.12
  window: 5
  stride: 2
  input_res: [224, 224]
  delta_scale: 50.0
  min_key_frac: 0.10
  contract_mode: method-validation
  allow_method_validation_only: true

model:
  trunk: dinov2_vits14
  d_model: 256
  n_layers: 3
  n_heads: 8

train:
  batch_size: 48
  max_steps: 12000        # matched to the shallow run on purpose
  lr: 3.0e-4
  weight_decay: 0.01
  log_every: 250
  num_workers: 6
  loss_weights: {keys: 1.0, bins: 0.5, delta: 2.0}

# key_exact keeps the 0.85 bar but is NOT the VPT comparison: VPT's 90.6% is
# most likely mean per-key accuracy, which is far more lenient than exact-set
# match. All three readings are reported; macro F1 is the one a collapse
# cannot fake, so it is what actually decides whether this worked.
gates:
  key_exact_min: 0.85
  key_macro_f1_min: 0.40
  macro_f1_warn: 0.6

output:
  dir: runs
