# Round 6: all 26 games with >=6 sessions, more training to clear the
# event-class gate that round 5 missed by 0.035 (0.745 vs 0.78).
#
# Round 5 proved the recipe on a subset: gameplay-frame game_top1 went
# 0.448 -> 0.888 once the split was stratified per game. This round scales
# to every eligible game and lifts max_steps so event_class agreement clears
# its gate too. Loss weighting is unchanged; the SFT loss already covers
# event tokens, it just needs more passes over a larger, more balanced set.
run_name: vl-r6
seed: 0

data:
  bench_dir: data/bench_r6
  labels: [data/bench_r6/labels_hybrid.jsonl]
  train_split: test

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 1800        # 2x round 5; larger 26-game set needs more passes
  grad_accum: 8
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 25

eval:
  max_new_tokens: 384

gates:
  json_valid_min: 0.95
  game_top1_gameplay_min: 0.50
  event_acc_min: 0.78

output:
  dir: runs
