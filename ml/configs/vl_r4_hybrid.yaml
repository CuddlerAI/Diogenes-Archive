# Round 4: hybrid labels — game name from dataset GT, everything else from
# the 235B teacher. Same 76-game / 3040-image bench as round 2.
#
# Why: same-frame comparison (round 3) showed every open teacher we may
# legally train on is weak at naming games — 235B answers only 24% of frames
# correctly and abstains on 65%. Gemini 2.5 Flash reaches 0.49 recall / 0.86
# precision but its terms bar its outputs from training data. The dataset
# itself carries the game title per session, so GT replaces the teacher for
# that one field on gameplay frames.
#
# The metric that matters here is game_top1 against session GT on the val
# split (held-out sessions), not teacher agreement: the student is now
# learning real titles rather than imitating a weak teacher.
run_name: vl-r4
seed: 0

data:
  bench_dir: data/bench_r2
  labels: [data/bench_r2/labels_hybrid.jsonl]
  train_split: test

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 900
  grad_accum: 8
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 25

eval:
  max_new_tokens: 384

# Gate on gameplay frames only. Session GT tags launcher/desktop/browser
# frames with the game title too, so an all-frame gate rewards guessing
# there and punishes correct abstention — round 4 scored the hybrid student
# BELOW baseline (0.175 vs 0.205) purely from that artefact.
gates:
  json_valid_min: 0.95
  game_top1_gameplay_min: 0.50
  event_acc_min: 0.78

output:
  dir: runs
