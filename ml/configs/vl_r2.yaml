# Round 2: 76 games x 2 sessions (3040 bench images) — fixes round 1's
# zero-shot gap, which came from training on only 6 games.
#
# Teacher: Qwen3-VL-32B-Instruct BF16 (Apache-2.0, 2xA100-40 TP=2). Round 1
# used 235B-A22B-AWQ on 8xL4; that shape had no capacity in any zone this
# round, so the teacher is a smaller member of the same open family — the
# swap is recorded here because it affects the label ceiling.
#
# COMPLIANCE unchanged: gaming-500-hours is method-validation only.
run_name: vl-r2
seed: 0

data:
  bench_dir: data/bench_r2
  labels: [data/bench_r2/labels.jsonl]
  train_split: test

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 900        # ~7200 samples seen at accum 8 (~4.7 epochs over the
  grad_accum: 8         # ~1520-row train split)
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 25

eval:
  max_new_tokens: 384

gates:
  json_valid_min: 0.95
  game_agree_min: 0.70
  event_acc_min: 0.80

output:
  dir: runs
