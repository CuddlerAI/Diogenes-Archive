# Round 5: 28 games, every multi-session game present in BOTH splits.
#
# Rounds 2 and 4 could not measure learning: a global hash split left 87% of
# val frames on games absent from training, so the score reported zero-shot
# transfer. Here the split is stratified per game and 100% of val frames come
# from games that also appear in training — the number finally answers "did
# it learn these games".
#
# Labels: hybrid — game name from dataset GT on teacher-declared gameplay
# frames, every other field from the 235B teacher (round 3 showed no open
# teacher we may train on names games well).
run_name: vl-r5
seed: 0

data:
  bench_dir: data/bench_r5
  labels: [data/bench_r5/labels_hybrid.jsonl]
  train_split: test

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 900
  grad_accum: 8
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 25

eval:
  max_new_tokens: 384

# Gate on gameplay frames: session GT tags launcher/browser frames with the
# game title too, so an all-frame gate rewards guessing there.
gates:
  json_valid_min: 0.95
  game_top1_gameplay_min: 0.50
  event_acc_min: 0.78

output:
  dir: runs
