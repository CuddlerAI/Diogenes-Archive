# GRPO refinement on the round-6 SFT adapter (doc 16 §4.4 final stage).
#
# Reward is programmatic (reward.py) — JSON validity + game hit (gameplay
# frames) + event hit + highlight calibration — and consumes no teacher
# output, so this stage carries no licensing exposure.
#
# Prep: SFT adapter from round 6 (gs://hakkolite-vl-scratch/round6/r6_adapter.tgz)
# and the round-6 bench + hybrid labels.
run_name: vl-grpo
seed: 0

data:
  bench_dir: data/bench_r6
  labels: [data/bench_r6/labels_hybrid.jsonl]
  train_split: test

model:
  name: Qwen/Qwen3-VL-4B-Instruct

grpo:
  group_size: 4          # completions per prompt (4 fits an L4 alongside
                         # gradient checkpointing; 6 OOM'd at 22 GB)
  temperature: 1.0       # exploration for the group
  # no explicit KL term this run (needs a 2nd frozen 4B copy, tight on
  # one L4); drift bounded by low lr + few steps + starting at the SFT policy
  lr: 2.0e-5             # lower than SFT — refining, not fitting
  max_steps: 300
  grad_accum: 4
  log_every: 10
  log_groups: 10         # group-level progress, independent of optimizer steps
  checkpoint_every: 50   # save the adapter mid-run; steps are expensive
  reward_weights: {json_valid: 0.2, game: 0.4, event: 0.3, highlight: 0.1}

eval:
  max_new_tokens: 384

# Event gating uses the COARSE vocabulary. Two independent strong
# annotators (235B, Gemini 2.5 Flash) agree on only 62.3% of frames under
# the 9 fine classes — less than the 78.7% a student reaches against one of
# them — because the fine vocabulary asks for distinctions a single frame
# cannot settle (idle vs movement has no motion cue in a still image).
# Gating on it measures imitation of one annotator's style. On the coarse
# vocabulary annotators agree 81.7% and both models score ~0.90.
gates:
  json_valid_min: 0.95
  game_top1_gameplay_min: 0.50
  event_coarse_min: 0.85
  # fine-grained event_class stays reported but ungated: its ceiling is set
  # by annotator disagreement, not by the model

output:
  dir: runs
