[project]
name = "diogenes-player"
version = "0.1.0"
description = "Diogenes Player Model training pipeline (W1: contract + ingest + window dataloader + bench)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "av>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# W2 训练（任意平台，CPU/MPS/CUDA）
torch = ["torch>=2.4", "torchvision>=0.19"]
# W3 导出/部署对账
deploy = ["onnx>=1.16", "onnxruntime>=1.18"]
# 训练机（Linux/GPU）：torchcodec 解码后端
train = ["torch>=2.4", "torchvision>=0.19", "torchcodec>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diogenes_player"]
