[project]
name = "diogenes-phase0"
version = "0.1.0"
description = "Phase 0 method-validation infra: IDM = frozen trunk + small non-causal head, on synthetic + open data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
    "torch>=2.1",
]

[project.optional-dependencies]
data = [
    "opencv-python-headless>=4.8",
    "OpenEXR>=3.2",          # strict named-channel depth evidence reader (Z/Y)
    "zstandard>=0.23",       # bind offline frame-pairs to the recorder frames projection
    "huggingface_hub>=0.23",
    "mcap>=1.2",            # D2E/OWAMcap event streams (data/d2e.py)
    "pyarrow>=14",          # COD 评估样本的索引表 (diogenes_wm/cod_adapter.py)
    "boto3>=1.34",          # R2 取数 (diogenes_wm/halo_adapter.py 的 r2:// 模式)
    "einops>=0.7",          # MG3 vendor 动作模块的硬依赖 (wm01/vendor/action_module.py)
]
vl = [
    "transformers>=4.49",
    "peft>=0.14",
    "pillow>=10",
    "torchvision>=0.20",   # Qwen2/3-VL processors require it
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diogenes_phase0*", "diogenes_vl*", "diogenes_wm*"]
