[package]
name = "dataminer-depth-ingest"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false
rust-version = "1.88"

# 独立服务刻意退出 DataMiner Rust workspace：它有自己的 lockfile、镜像和 CI，
# 不把服务端依赖拖进客户端/探针，也不给 U2 制造 Cargo.lock 冲突。
[workspace]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
depth-lab = { path = "../../tools/depth-lab" }
fs2 = "0.4"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusty-s3 = "=0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }
