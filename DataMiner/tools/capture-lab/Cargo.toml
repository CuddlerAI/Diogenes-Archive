[package]
name = "capture-lab"
default-run = "capture-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
capture-core = { path = "../../crates/capture-core", features = ["audio-lab"] }
crossbeam-channel.workspace = true
depth-lab = { path = "../depth-lab" }
dm-depth-probe = { path = "../depth-lab-probe" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tracing.workspace = true
tracing-subscriber.workspace = true
view-scale = { path = "../../crates/view-scale" }
windows-capture-wgc = { path = "../../crates/windows-capture-wgc" }
zstd = "0.13.3"
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
