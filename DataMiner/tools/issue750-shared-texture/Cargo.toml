[package]
name = "issue750-shared-texture"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this experiment outside the production DataMiner workspace.  In
# particular, building it must not rewrite DataMiner/Cargo.lock.
[workspace]

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Threading",
] }
